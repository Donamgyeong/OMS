{% extends 'base.html' %}{% block content %}<section class="login"><h1>로그인</h1><p>Microsoft 회사 계정으로 근무 내역을 확인하세요.</p>{% if auth_error %}<p role="alert" class="notice error">{{ auth_error }}</p>{% endif %}{% if configured %}<a class="btn btn-primary" href="{% url 'entra_login' %}?next={{ next|default:'/'|urlencode }}">Microsoft 회사 계정으로 로그인</a>{% else %}<p role="status">회사 계정 로그인을 준비 중입니다. 관리자에게 문의하세요.</p>{% endif %}</section>{% endblock %}
