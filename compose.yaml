services:
  app:
    image: ${APP_IMAGE:-oms:local}
    platform: linux/arm64
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':'localhost', 'X-Forwarded-Proto':'https'}), timeout=5); assert r.status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    image: postgres:17-bookworm
    platform: linux/arm64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 384m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  media:
