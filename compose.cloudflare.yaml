# Standalone deployment: use this file instead of compose.yaml (do not merge).
# Public hostname and service URL http://app:8000 are configured in Cloudflare.
services:
  holiday-worker:
    image: ${APP_IMAGE:-oms:local}
    platform: linux/arm64
    profiles: [holidays]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "0"
    command: ["python", "manage.py", "sync_holidays", "--watch"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tunnel
      - database
    restart: unless-stopped
    mem_limit: 256m
  teams-worker:
    image: ${APP_IMAGE:-oms:local}
    platform: linux/arm64
    profiles: [teams]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: ["python", "manage.py", "send_teams_notifications"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tunnel
      - database
    restart: unless-stopped
    mem_limit: 256m
  app:
    image: ${APP_IMAGE:-oms:local}
    platform: linux/arm64
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "1"
      DJANGO_TRUST_PROXY: "1"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tunnel
      - database
    volumes:
      - media:/app/media
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':'localhost', 'X-Forwarded-Proto':'https'}), timeout=5); assert r.status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    image: postgres:17-bookworm
    platform: linux/arm64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks:
      - database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 384m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.3}
    platform: linux/arm64
    user: "65532:65532"
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:2000
      - --loglevel
      - warn
      - --protocol
      - ${CLOUDFLARED_PROTOCOL:-auto}
      - run
      - --token-file
      - /run/secrets/cloudflared_token
    secrets:
      - cloudflared_token
    depends_on:
      app:
        condition: service_healthy
    networks:
      - tunnel
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  tunnel:
  database:
    internal: true
volumes:
  postgres_data:
  media:
secrets:
  cloudflared_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./secrets/cloudflared-token}
